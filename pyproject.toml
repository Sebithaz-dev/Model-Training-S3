[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "model-training-s3"
version = "0.1.0"
description = "Entrenamiento de modelo Citibike con subida a S3"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B023 (late-binding en lambdas de predict.py) se resuelve en hotfix dedicado.
ignore = ["E501", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

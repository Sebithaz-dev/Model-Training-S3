name: CI

# Trunk-Based Development: un unico trunk (main). La CI se ejecuta:
#   - en cada pull_request a main  -> gate de merge (obligatorio verde)
#   - en cada push a main          -> verificacion post-merge del trunk
# TBD no usa rama develop; el requisito IE3/IE4 pedia "push a develop",
# que aqui se sustituye por "push a main" (ver README, seccion TBD).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint y tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check ml tests

      - name: Tests (pytest)
        run: pytest tests/ -v

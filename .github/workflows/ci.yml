name: CI

# Trunk-Based Development: un unico trunk (main). La CI se ejecuta:
#   - en cada pull_request a main  -> gate de merge (obligatorio verde)
#   - en cada push a main          -> verificacion post-merge del trunk
# TBD no usa rama develop; el requisito IE3/IE4 pedia "push a develop",
# que aqui se sustituye por "push a main" (ver README, seccion TBD).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint y tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check ml tests scripts

      - name: Tests (pytest + cobertura)
        run: pytest tests/ -v --cov=ml --cov-report=xml --cov-report=term --cov-fail-under=60

      - name: Health check (config)
        run: python -m ml.health --json --skip-s3 --skip-artifacts

  docker:
    name: Imagen Docker (build, smoke test y publicacion)
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sebithaz-dev/model-training-s3

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Construir imagen (tag = SHA del commit)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} .

      - name: Smoke test del contenedor (health check de configuracion)
        run: |
          docker run --rm $IMAGE:${{ github.sha }} \
            python -m ml.health --json --skip-s3 --skip-artifacts

      - name: Publicar en GHCR (solo push a main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

name: Train Model

on:
  schedule:
    # Domingo 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

env:
  CLOUDWATCH_NAMESPACE: CitiBike/Model

jobs:
  train:
    name: Entrenamiento + quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Las credenciales del Learner Lab caducan cada 4 h. Si expiraron, el
      # job se omite de forma explicita en vez de fallar en rojo: el rojo se
      # reserva para fallas reales de codigo, datos o calidad del modelo.
      - name: Preflight de credenciales AWS
        id: aws
        run: |
          if aws sts get-caller-identity >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Credenciales AWS expiradas o invalidas. Se omite el entrenamiento; actualiza los secrets de la sesion del Learner Lab."
            {
              echo "## Entrenamiento omitido"
              echo ""
              echo "Las credenciales AWS del Learner Lab expiraron. El workflow no se marca como fallido para no ocultar fallas reales."
              echo "Actualiza \`AWS_ACCESS_KEY_ID\`, \`AWS_SECRET_ACCESS_KEY\` y \`AWS_SESSION_TOKEN\` y relanza con \`workflow_dispatch\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Descargar datos de entrenamiento desde S3
        if: steps.aws.outputs.ready == 'true'
        run: |
          mkdir -p data
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/${{ vars.S3_DATA_KEY || 'curated/citibike_trips/citibike_curated.snappy.parquet' }} data/datos.parquet

      - name: Entrenar modelo (incluye quality gate)
        if: steps.aws.outputs.ready == 'true'
        run: python -m ml.train --input data/datos.parquet
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_MODEL_PREFIX: ${{ vars.S3_MODEL_PREFIX || 'models/' }}
          CLOUDWATCH_NAMESPACE: ${{ vars.CLOUDWATCH_NAMESPACE || env.CLOUDWATCH_NAMESPACE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Evidencia explicita del gate: aunque ml.train ya lo aplica antes de
      # subir a S3, este paso deja el resultado en el resumen del run.
      - name: Publicar resultado del quality gate
        if: steps.aws.outputs.ready == 'true'
        run: |
          python -m ml.quality_gate --metrics ml/artefactos/metricas.json --json | tee gate.json
          {
            echo "## Quality gate"
            echo ""
            echo '```json'
            cat gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check (artefactos + S3)
        if: steps.aws.outputs.ready == 'true'
        run: python -m ml.health --json --strict
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_MODEL_PREFIX: ${{ vars.S3_MODEL_PREFIX || 'models/' }}
